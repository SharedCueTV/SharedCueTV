<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="cueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#312E81" stroke-width="3" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="256" r="160" fill="#4F46E5" opacity="0.18" filter="url(#softGlow)" />

  <!-- Shared Cue Icon Geometry: Dynamic Play/Cue pointer and shared syncing resonance rings -->
  <g transform="translate(0, 0)">
    <!-- Outer Synchronized Resonance Arc (Shared Pulse) -->
    <path d="M 170 130 C 230 100, 310 110, 356 150" fill="none" stroke="url(#cueGrad2)" stroke-width="20" stroke-linecap="round" opacity="0.85" />
    <path d="M 342 382 C 282 412, 202 402, 156 362" fill="none" stroke="url(#cueGrad1)" stroke-width="20" stroke-linecap="round" opacity="0.85" />

    <!-- Center Cue Node / Playback Pulse Mark (The "Cue") -->
    <!-- Interlocking Cue loops forming subtle S & C curves -->
    <path d="M 210 180 C 280 140, 340 180, 330 250 C 322 310, 240 310, 230 350 C 220 390, 270 410, 300 400" 
          fill="none" stroke="url(#accentGlow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Cue Signal / Play Beacon Point -->
    <g filter="url(#softGlow)">
      <polygon points="230,210 230,300 310,255" fill="url(#cueGrad2)" />
    </g>
    <polygon points="236,222 236,288 296,255" fill="#FFFFFF" opacity="0.95" />

    <!-- Signal Beacon Dots (Shared cues radiating) -->
    <circle cx="360" cy="190" r="14" fill="#38BDF8" />
    <circle cx="395" cy="255" r="10" fill="#818CF8" opacity="0.9" />
    <circle cx="152" cy="255" r="10" fill="#C084FC" opacity="0.9" />
    <circle cx="170" cy="320" r="14" fill="#A855F7" />
  </g>
</svg>
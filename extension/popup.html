<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SharedCueTV</title>
<style>
  :root { --bg:#0b0f19; --c:#171b26; --c2:#262a35; --text:#f9fafb; --muted:#94a3b8; --primary:#4cd7f6; --pc:#06b6d4; --sec:#6366f1; --err:#ffb4ab; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; background: var(--bg); color: var(--text); font: 14px/20px system-ui, sans-serif; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
  .brand img { width: 28px; height: 28px; }
  .brand span { color: var(--primary); }
  .brand b { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: linear-gradient(135deg, var(--pc), var(--sec)); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #bcc9cd; font-weight: 600; }
  input { height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: var(--c); color: var(--text); font: inherit; outline: none; }
  input:focus { box-shadow: 0 0 0 2px rgba(6,182,212,.6); }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .08em; font-family: ui-monospace, monospace; }
  button { height: 38px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; font: 600 13px/1 system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.08); }
  button.primary { background: linear-gradient(135deg, var(--pc), var(--sec)); }
  button.danger { background: rgba(255,180,171,.15); color: var(--err); }
  .card { padding: 12px; border-radius: 12px; background: var(--c); display: flex; flex-direction: column; gap: 6px; }
  .muted { color: var(--muted); font-size: 12px; }
  .ok { color: var(--primary); font-weight: 700; }
  .code { font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: .1em; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icon-48.png" alt="">Shared<span>Cue</span><b>TV</b></div>

  <section id="out">
    <form id="f" style="display:flex;flex-direction:column;gap:10px" autocomplete="off">
      <label>Dein Name<input id="name" maxlength="24" required placeholder="z. B. Kevin"></label>
      <label>Raum-Code
        <span class="row"><input id="code" maxlength="7" required placeholder="K7Q-4MX"><button type="button" id="gen" title="Neuen Raum erzeugen">Neu</button></span>
      </label>
      <label>Passwort (optional)<input id="pw" type="password" maxlength="64"></label>
      <button class="primary" type="submit">Raum beitreten</button>
    </form>
    <p class="muted">Alle öffnen denselben Titel auf Netflix, Disney+ oder Prime Video – jeder mit seinem eigenen Abo. Play, Pause und Spulen laufen dann für alle gleich.</p>
  </section>

  <section id="in" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="card">
      <span class="muted">Raum</span>
      <span class="code" id="rc"></span>
      <span id="st" class="ok">verbunden</span>
      <span class="muted" id="ppl"></span>
    </div>
    <p class="muted">Schick deinen Freunden den Code (und ggf. das Passwort). Sie brauchen auch diese Erweiterung.</p>
    <button class="danger" id="leave" type="button">Raum verlassen</button>
  </section>
</main>
<script src="popup.js"></script>
</body>
</html>
